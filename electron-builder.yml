appId: dev.bologv.app
productName: bologv
directories:
  output: dist-pkg
files:
  - dist/**/*
  - resources/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: bologv-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
